name: Playwright Tests
run-name: Playwright ${{ inputs.suite || 'regressão completa' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Suíte a executar pela Central
        type: choice
        options: [all, ui, api]
        default: all
        required: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run selected Playwright suite
        env:
          TEST_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          case "$TEST_SUITE" in
            all) npm test ;;
            ui) npm run test:ui ;;
            api) npm run test:api ;;
            *) echo "Unknown Playwright suite" >&2; exit 1 ;;
          esac

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
